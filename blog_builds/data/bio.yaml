job_market_alert: 

paragraphs:
  - "Hi, I'm Sachita! I recently finished my PhD at Northwestern University, where I was advised by [Dr. Nick Diakopoulos](http://www.nickdiakopoulos.com). I'm tremendously excited to be joining as a postdoc at the [UW Center for an Informed Public](https://www.cip.uw.edu) in Fall 2026, where I will be mentored by [Dr. Emma Spiro](https://ischool.uw.edu/people/faculty/profile/espiro) and [Dr. Gary Hsieh](https://faculty.washington.edu/garyhs/)!"
  
  - "I study and design sociotechnical systems that help people make sense of a complex online information ecosystem. I'm interested in how novel technologies (social platforms, tools for thought, generative AI) reshape sensemaking, science communication, and creative work, and in what AI slop and synthetic media do to the communities and infrastructures through which people make meaning together."

  - "During my PhD, I designed interactive AI-infused systems to support science journalists in exploring and making sense of scientific information during newsgathering. This research surfaced latent value trade-offs and proposed design patterns to help journalists navigate these more thoughtfully and intentionally, in the interest of accurate, timely, useful science communication."

email: "sachita [dot] nishal [at] gmail [dot] com"
