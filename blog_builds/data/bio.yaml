job_market_alert: 

paragraphs:
  - "Hi, I'm Sachita! I am a postdoc at the [UW Center for an Informed Public](https://www.cip.uw.edu) where I am mentored by [Dr. Emma Spiro](https://ischool.uw.edu/people/faculty/profile/espiro) and [Dr. Gary Hsieh](https://faculty.washington.edu/garyhs/)! I recently completed my PhD at Northwestern University, where I was advised by [Dr. Nick Diakopoulos](http://www.nickdiakopoulos.com)."
  
  - "I study and design sociotechnical systems that help people make sense of a complex online information ecosystem. I'm interested in how these systems might reshape sensemaking, and how they impact the communities and infrastructures through which people make meaning together."

  - "During my PhD, I designed interactive AI-infused systems to support science journalists in exploring and making sense of scientific information during newsgathering. This research surfaced different value trade-offs and proposed design patterns to help journalists navigate these the information ecosystem thoughtfully and intentionally, in the interest of accurate, timely, useful science communication."

email: "sachita [dot] nishal [at] gmail [dot] com"
