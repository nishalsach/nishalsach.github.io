job_market_alert: "I am on the 2025-2026 academic job market! I'm looking for tenure-track positions and postdocs!"

paragraphs:
  - "Hi, I'm Sachita! I'm a 5th-year PhD candidate at Northwestern University, advised by [Dr. Nick Diakopoulos](http://www.nickdiakopoulos.com). My research asks: how can systems for navigating, parsing, and creating with information on the internet support people's values and practices?"

  - "I address this question in the domain of [science journalism](/projects#value-sensitive-design-theory-for-journalism), where I design interactive AI-infused systems to support journalists' [exploration, sensemaking, and communication](/projects#modeling-newsworthiness-for-science-journalism) of large-scale scientific information. New technologies like generative AI introduce value trade-offs—accuracy versus efficiency, independence versus algorithmic support—that reshape workflows and professional identity."

  - "Through [computational techniques that operationalize news values](/projects#modeling-newsworthiness-for-science-journalism) and [interactive systems](/projects#news-compass-visualizing-collective-coverage-patterns) that reveal how AI impacts practice, my work demonstrates that effective sensemaking systems must uphold what makes knowledge work meaningful: professional standards, public mission, and personal rewards like [agency and creativity](/projects#designing-for-agency-in-ai-assisted-writing). I extend this empirical work into [theory](/projects#value-sensitive-design-theory-for-journalism) and [evaluation frameworks](/projects#domain-specific-ai-evaluation-for-journalism) that help designers navigate value tensions in AI systems."

email: "nishal [at] u.northwestern.edu"
