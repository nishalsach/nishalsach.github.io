job_market_alert: "I am on the 2025-2026 academic job market! I'm looking for tenure-track positions and postdocs!"

paragraphs:
  - "Hi, I'm Sachita! I'm a 5th-year PhD candidate at Northwestern University, advised by [Dr. Nick Diakopoulos](http://www.nickdiakopoulos.com). My research asks: how can systems for navigating, parsing, and creating with information on the internet support people's values and practices?"

  - "I address this question in the domain of science journalism, where I design interactive AI-infused systems to support how journalists explore, make sense of, and translate large-scale scientific information
  during news production. New technologies like generative AI introduce value trade-offs—accuracy versus efficiency, independence versus algorithmic support—that reshape workflows and professional identity. My research surfaces such value trade-offs and proposes design patterns to help journalists navigate these more thoughtfully and intentionally, in the interest of accurate, timely, useful science communication."

email: "nishal [at] u.northwestern.edu"
