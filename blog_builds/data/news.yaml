items:
  - title: "Job update :)"
    date: 2026-07-15
    summary: >
      A long overdue job update, but I will be joining  as a postdoc at the UW Center for an Informed Public in Fall 2026, where I will be mentored by Dr. Emma Spiro and Dr. Gary Hsieh. I'm really really really excited!
  - title: "What kind of problem is AI slop anyway?"
    date: 2026-07-15
    summary: >
      Marijn Sax, Kimon Kieslich, and I have new work that argues for a sociotechnical approach to defining and analyzing AI slop, counter to approaches that might rely solely on whether slop satisfies individual users. The more urgent question is what it does to the communities and conditions through which meaning and creative value are made, we argue in this piece [published at ACM AI Letters](https://dl.acm.org/doi/10.1145/3828758).
  - title: "New work on tropes in AI storytelling @ EvalEval 2026"
    date: 2026-07-01
    summary: >
      My coauthor Jack Bandy and I published an [audit](https://aclanthology.org/2026.evaleval-1.22/) about the gendered tropes that manifest, even without prompting, in fictional stories generated by LLMs. This audit has implications for how we study implicit bias and storytelling with AI, and was presented at the EvalEval workshop at ACL 2026.
  - title: "New CHI 2026 paper on building AI-infused systems to support people's values and agency"
    date: 2026-02-10
    summary: >
      A study I led during my internship at Microsoft Research has been accepted to CHI 2026! We worked with 20 science journalists to uncover the ways in which differnt kinds of LLM-infused sensemaking tools might impact their values, practices and hence their _agency_. Our work offers both design and theoretical implications that follow from this. Find the paper [here](https://nishalsach.github.io/pdfs/2026-chi.pdf), and find me in Barcelona at CHI this April!
  - title: "I am on the job market!"
    date: 2025-11-01
    summary: >
      I am looking for tenure-track research and postdoc positions for Summer 2026 an onwards! An exciting (but also unnerving) time :)
  - title: "Participate in our new study!"
    date: 2025-10-15
    summary: >
      Are you a science journalist? Interested in exploring the newsworthy research, along with who has covered it in the news and how? Excited to find new stories? We invite you to participate in our new study! Sign up [here](https://tinyurl.com/newscompass)!
  - title: "Value-sensitive design paper headed to DIS 2025"
    date: 2025-06-01
    summary: >
      Our [paper on value-sensitive design for journalism](https://nishalsach.github.io/pdfs/2025-vsd-journalism.pdf) has been accepted to the ACM DIS 2025 conference, and also won a Best Paper Honorable Mention award! The paper explores how we can design sociotechnical systems for journalism that support journalists' values, and has some fun discussion of the value tensions and trade-offs that arise in the design process.

  - title: "A whirlwind summer of conferences"
    date: 2025-05-01
    summary: >
      It's about to be a whirlwind summer! I will be attending CSST (hosted by Syracuse University iSchool) in May, followed by ICA in Denver in June, then HCIC in Wisconsin, and finally DIS in Portugal in July! If you're attending any of these conferences, please do reach out, I'd love to meet up and chat about my work!

  - title: "Co-organizing News Futures at CHI 2025"
    date: 2025-04-15
    summary: >
      I'll be co-organizing the workshop on [News Futures](https://nishalsach.github.io/pdfs/2025-news-futures-chi.pdf) at CHI 2025 in Yokohama, Japan! We'll explore the design of sociotechnical systems for news production and consumption, and hopefully develop new research ideas for the field going ahead!

  - title: "Tools for Thought short paper accepted"
    date: 2025-04-05
    summary: >
      Our short paper titled [Designing for Agency in LLM-Infused Writing Support Tools for Science Journalism](https://nishalsach.github.io/pdfs/2025-toolsforthought-science.pdf) has been accepted to the workshop on Tools for Thought at CHI 2025! This work comes out of my internship at MSR FATE last summer; stay tuned for more on this over the next year.

  - title: "Prospectus passed—officially ABD!"
    date: 2025-03-15
    summary: >
      I've officially passed my prospectus exam! My dissertation will focus on different ways of designing creativity support tools for journalists, and how they expand our theoretical notions of creativity in this domain.
